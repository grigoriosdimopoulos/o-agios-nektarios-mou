name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The real google-services.json is not in the repository. The template
      # carries the same structure — including a client for the debug variant's
      # '.debug' applicationId, which the plugin insists on — and that is all
      # that is needed to compile. A build made this way cannot reach a real
      # Firebase project.
      - name: Provide Firebase config
        run: cp app/google-services.json.example app/google-services.json

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Paparazzi renders the UI to PNG and compares against the committed
      # goldens. This is separate from the line above on purpose:
      # testDebugUnitTest *runs* the snapshot tests but neither records nor
      # verifies them — it renders and throws the result away, so a commit that
      # changes a colour without re-recording passes. That happened, and this
      # is the step that would have caught it.
      #
      # On failure the delta images say exactly what moved, so they are worth
      # uploading.
      - name: Verify UI snapshots
        run: ./gradlew verifyPaparazziDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: paparazzi-failures
          path: app/build/paparazzi/failures/
          if-no-files-found: ignore

      # Exercises R8 shrinking against the ProGuard rules and lint's fatal
      # checks — neither of which the debug build touches, and both of which
      # have caught real bugs here.
      - name: Assemble release
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

  # The security rules are the only authorization layer on this plan, and CI
  # was not running their tests — so a rule that opened a hole would have been
  # caught by the release job, after somebody had already tagged it.
  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rules tests
        working-directory: firebase
        run: |
          npm install --no-audit --no-fund
          npm install --no-save firebase-tools
          npx firebase emulators:exec --only firestore \
            --project demo-rules-check 'node rules.test.mjs'

  functions:
    name: Cloud Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firebase/functions/package.json

      - run: npm install
        working-directory: firebase/functions

      - run: npx tsc --noEmit
        working-directory: firebase/functions
