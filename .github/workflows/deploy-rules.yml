name: Ανέβασε τους κανόνες ασφαλείας

# Οι κανόνες του Firestore είναι το μόνο πράγμα που εμποδίζει έναν
# συνδεδεμένο χρήστη να διαβάσει τα τηλέφωνα όλων. Δεν είναι κώδικας της
# εφαρμογής — ζουν στον διακομιστή και ανεβαίνουν χωριστά. Μέχρι να ανέβουν,
# ό,τι γράφει το repo δεν ισχύει πουθενά.
#
# Κανονικά ανεβαίνουν με `firebase deploy` από τερματικό. Αυτό κάνει το ίδιο
# από το κινητό: πατάς Run workflow και τελείωσε.
#
# Τρέχει πρώτα τα ίδια 241 tests στον εξομοιωτή. Κανόνες που κόβουν κάτι που
# δεν έπρεπε είναι χειρότεροι από κανόνες που δεν ανέβηκαν, γιατί σπάνε την
# εφαρμογή σε όλους ταυτόχρονα και δεν φαίνεται γιατί.
#
# Χρειάζεται ένα secret FIREBASE_SERVICE_ACCOUNT — το JSON από
# Firebase Console → Project settings → Service accounts → Generate new
# private key.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Μόνο τα tests, χωρίς ανέβασμα'
        type: boolean
        default: false

# Δύο deploys μαζί θα άφηναν τον διακομιστή σε όποιο από τα δύο τερμάτισε
# δεύτερο, που δεν είναι απαραίτητα το πιο πρόσφατο.
concurrency:
  group: firestore-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Java 21, όχι 17.
      #
      # Το firebase-tools σταμάτησε να δέχεται JDK κάτω από 21, και ο εξομοιωτής
      # πέθαινε με «no longer supports Java version before 21» — αφού είχε ήδη
      # στηθεί όλο το υπόλοιπο job. Το Gradle build τρέχει το ίδιο σε 21, οπότε
      # όλα τα jobs μένουν στην ίδια έκδοση: CI που δοκιμάζει σε άλλη JDK από
      # αυτή που χτίζει το release είναι CI που δεν δοκιμάζει το release.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Εγκατάσταση
        working-directory: firebase
        run: |
          npm install --no-audit --no-fund
          npm install --no-save firebase-tools@15.28.2

      # Η πύλη. Ο εξομοιωτής τρέχει τους πραγματικούς κανόνες, οπότε ό,τι
      # περνάει εδώ συμπεριφέρεται έτσι και στον διακομιστή.
      - name: Tests κανόνων
        working-directory: firebase
        run: |
          npx firebase emulators:exec --only firestore \
            --project demo-rules-check 'node rules.test.mjs'

      - name: Έλεγχος ταυτότητας του project
        if: ${{ !inputs.dry_run }}
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$SA" ]; then
            echo "::error::Λείπει το secret FIREBASE_SERVICE_ACCOUNT." \
                 "Firebase Console → Project settings → Service accounts →" \
                 "Generate new private key, και επικόλλησε όλο το JSON."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

          # Το project id δεν δίνεται με το χέρι επίτηδες. Ένα λάθος γράμμα θα
          # ανέβαζε τους κανόνες σε άλλο project και θα άφηνε το πραγματικό
          # ορθάνοιχτο, με το workflow να λέει «επιτυχία».
          PID="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/sa.json'))['project_id'])")"

          # Και αν υπάρχει το google-services.json, πρέπει να δείχνει στο ίδιο
          # project με το κλειδί — αλλιώς οι κανόνες θα πήγαιναν κάπου που η
          # εφαρμογή δεν κοιτάει καν.
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > "$RUNNER_TEMP/gs.json"
            APP_PID="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/gs.json'))['project_info']['project_id'])")"
            if [ "$PID" != "$APP_PID" ]; then
              echo "::error::Το service account είναι για το project '$PID' αλλά" \
                   "η εφαρμογή δείχνει στο '$APP_PID'. Δεν ανεβαίνει τίποτα."
              exit 1
            fi
          fi
          echo "PROJECT_ID=$PID" >> "$GITHUB_ENV"
          echo "Project: $PID"

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -euo pipefail
          if ! npx firebase deploy \
                 --only firestore:rules,firestore:indexes \
                 --project "$PROJECT_ID" \
                 --non-interactive 2>&1 | tee deploy.log; then
            if grep -qiE 'permission|PERMISSION_DENIED|403' deploy.log; then
              echo "::error::Το service account δεν έχει δικαίωμα να ανεβάσει" \
                   "κανόνες. Google Cloud Console → IAM → βρες τον λογαριασμό" \
                   "firebase-adminsdk... → Edit → Add another role →" \
                   "«Firebase Rules Admin» και «Cloud Datastore Index Admin»."
            fi
            exit 1
          fi

      # success() και όχι always(): μια σύνοψη που λέει «ανέβηκαν» κάτω από ένα
      # κόκκινο job είναι χειρότερη από καθόλου σύνοψη.
      - name: Σύνοψη
        if: success()
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "## Μόνο tests"
              echo
              echo "Οι κανόνες πέρασαν τα tests. Δεν ανέβηκε τίποτα."
            else
              echo "## Οι κανόνες ανέβηκαν"
              echo
              echo "Project \`${PROJECT_ID:-—}\`."
              echo
              echo "Επιβεβαίωση: Firebase Console → Firestore Database → Rules."
              echo "Η ημερομηνία πάνω δεξιά πρέπει να είναι η σημερινή."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Το κλειδί του service account δίνει πρόσβαση σε όλο το project. Ο
      # runner σβήνεται ούτως ή άλλως, αλλά όχι επειδή το εμπιστεύομαι.
      - name: Καθάρισμα
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/gs.json"
